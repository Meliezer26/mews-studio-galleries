name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pings continus (~12 min de couverture)
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://mews-galleries.onrender.com/)
            if [ "$code" = "200" ]; then echo "ping $i OK"; else echo "ping $i : HTTP $code"; fi
            [ "$i" -lt 4 ] && sleep 250
          done
          exit 0
