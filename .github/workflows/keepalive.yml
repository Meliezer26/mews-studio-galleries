name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le service Render
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://mews-galleries.onrender.com/)
            if [ "$code" = "200" ]; then echo "accueil OK ($code)"; exit 0; fi
            echo "essai $i: HTTP $code"; sleep 30
          done
          curl -s -o /dev/null --max-time 150 https://mews-galleries.onrender.com/ || true
          exit 0
